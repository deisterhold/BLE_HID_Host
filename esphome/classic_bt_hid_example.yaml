esphome:
  name: classic-hid-events

external_components:
  - source:
      type: git
      url: https://github.com/deisterhold/BLE_HID_Host.git
      ref: main
      path: esphome/components
    components: [classic_bt_hid]

esp32:
  variant: esp32
  flash_size: 4MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_BT_ENABLED: "y"
      CONFIG_BTDM_CTRL_MODE_BTDM: "y"
      CONFIG_BT_BLUEDROID_ENABLED: "y"
      CONFIG_BT_CLASSIC_ENABLED: "y"
      CONFIG_BT_HID_ENABLED: "y"
      CONFIG_BT_HID_HOST_ENABLED: "y"
    advanced:
      include_builtin_idf_components:
        - bt
        - nvs_flash

logger:
  baud_rate: 115200

classic_bt_hid:
  mac_address: "75:47:7D:57:5A:3C"
  on_connect:
    - then:
        - lambda: |-
            ESP_LOGI("hid_example", "Connected to %s", address.c_str());
  on_disconnect:
    - then:
        - lambda: |-
            ESP_LOGI("hid_example", "Disconnected from %s", address.c_str());
  on_connection_error:
    - then:
        - lambda: |-
            ESP_LOGW("hid_example", "Connection to %s failed with status %u",
                     address.c_str(), status);
  on_input:
    - then:
        - lambda: |-
            // Generic raw-event filter example for the observed mouse packet:
            // report ID 0x03, button mask in byte 1. Other devices can use
            // different report IDs, layouts, and button bits.
            if (address != "75:47:7D:57:5A:3C" || report.size() != 3 || report[0] != 0x03) {
              return;
            }
            static uint8_t previous_buttons = 0;
            const uint8_t current_buttons = report[1];
            const uint8_t released = previous_buttons & static_cast<uint8_t>(~current_buttons);
            previous_buttons = current_buttons;
            if (released & 0x10) ESP_LOGI("hid_example", "Left released");
            if (released & 0x20) ESP_LOGI("hid_example", "Right released");
            if (released & 0x04) ESP_LOGI("hid_example", "Bottom released");